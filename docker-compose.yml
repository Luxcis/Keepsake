# 拓扑（统一镜像版）：
#   app    —— 单镜像：Nginx(80, SPA + /api 反代到容器内 127.0.0.1:8080) + Go API(8080, SQLite)
#   redis  —— 可选（profiles: ["redis"]）：.env 配置 REDIS_ADDR 并以
#             `docker compose --profile redis up -d` 启动才生效；
#             未启用时会话/限流退化为进程内存（单实例部署可接受，重启后需重新登录）。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8000}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PORT: "8080"
      DATA_DIR: /data
      DB_FILE: ${DB_FILE:-journey.db}
      # Redis 可选：留空即不启用（内存会话/限流）；启用场景见上方 redis 服务注释
      REDIS_ADDR: ${REDIS_ADDR:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 管理员自动引导：.env 配置 ADMIN_USERNAME/ADMIN_PASSWORD 后，app 启动即首次引导；
      # 同名已存在则跳过（不重置密码）。全部留空则不进容器，也不做引导。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SITE_PASSWORD: ${ADMIN_SITE_PASSWORD:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_URL_EXPIRES: ${COS_URL_EXPIRES:-900}
      # CORS_ORIGINS 为空即禁用（生产同源；开发走 vite proxy）
    volumes:
      - ./data:/data
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:8-alpine
    profiles: ["redis"] # 不以 --profile redis 启动时本服务完全不创建
    command: ["redis-server", "--appendonly", "yes"]  # AOF 开启，重启不丢会话/缓存（验收 §6.1）
    volumes:
      - ./data:/data
    restart: unless-stopped
