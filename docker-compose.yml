# 计划 §5.2 服务拓扑：
#   web    —— Nginx：提供 Vue dist，/api 反代 api，对外发布端口
#   api    —— Go API：SQLite(持久化卷) / Redis / COS
#   redis  —— 缓存与会话：内部网络，不发布端口
name: keepsake

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./server
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PORT: "8080"
      DATA_DIR: /data
      DB_FILE: ${DB_FILE:-journey.db}
      REDIS_ADDR: redis:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 管理员自动引导：.env 配置 ADMIN_USERNAME/ADMIN_PASSWORD 后，api 启动即首次引导；
      # 同名已存在则跳过（不重置密码）。全部留空则不进入容器，也不做引导。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SITE_PASSWORD: ${ADMIN_SITE_PASSWORD:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_URL_EXPIRES: ${COS_URL_EXPIRES:-900}
      # CORS_ORIGINS 为空即禁用（生产同源；开发走 vite proxy）
    volumes:
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF 开启，重启不丢会话/缓存（验收 §6.1）
    volumes:
      - ./data:/data
    restart: unless-stopped