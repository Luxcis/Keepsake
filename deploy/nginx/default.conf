# Nginx 站点配置（计划 §5.2）：提供 Vue dist，并将 /api 反向代理到 Go API。
# 访问协议归属：外层 TLS 网关（域名 HTTPS 直解后转发）已传 X-Forwarded-Proto 时优先采用，
# 外层未传（直接访问本容器，多为 http）时回落本层 $scheme。
# Go 端 CSRF 同源校验（middleware.go csrfSameOrigin）依赖该值与浏览器 Origin 的协议一致。
map $http_x_forwarded_proto $api_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 本地存储模式下媒体经 /api/storage 直传（COS 模式不经过本层）；
  # 单对象上限为视频 400MB（图片 30MB 由服务端按类型校验）。
  # 预留请求头/编码开销，上限略高于业务 400MB。
  client_max_body_size 410m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # 基础安全头（计划 §5.1）；HTTPS 头由外层网关/后续 TLS 配置补充
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # SPA 静态资源：带内容哈希，可长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # API 反向代理（同源，避免跨域 Cookie/CORS 问题）
  # 统一镜像：Go API 与 Nginx 同容器，反代走回环地址 127.0.0.1（compose 曾用服务名 api:8080）。
  # Host 必须用 $http_host（保留端口）：api 端做 Cookie 同源与 CSRF Origin 校验，
  # $host 会丢弃端口导致 http://site:8080 的 Origin 校验被误判为跨站。
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $api_proto;
    proxy_connect_timeout 5s;
    # 本地直传期间 Go 侧可能持续写盘；400MB 视频在慢速上行下需要更长的请求与响应窗口
    #（普通 JSON 接口仍毫秒级返回）。
    proxy_request_buffering off;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  # SPA 路由回退
  location / {
    try_files $uri /index.html;
  }
}
