# Nginx 站点配置（计划 §5.2）：提供 Vue dist，并将 /api 反向代理到 Go API。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;   # API 仅承载 JSON；照片走浏览器直传 COS，不经 Nginx
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # 基础安全头（计划 §5.1）；HTTPS 头由外层网关/后续 TLS 配置补充
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # SPA 静态资源：带内容哈希，可长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # API 反向代理（同源，避免跨域 Cookie/CORS 问题）
  # 统一镜像：Go API 与 Nginx 同容器，反代走回环地址 127.0.0.1（compose 曾用服务名 api:8080）。
  # Host 必须用 $http_host（保留端口）：api 端做 Cookie 同源与 CSRF Origin 校验，
  # $host 会丢弃端口导致 http://site:8080 的 Origin 校验被误判为跨站。
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # SPA 路由回退
  location / {
    try_files $uri /index.html;
  }
}
