ilities":[],"retry":"manual","runId":"admin-backup","status":"succeeded","stepId":"archive.execute","type":"call_tool"},{"attempt":1,"claim":{"executorId":"comet-native-archive-finalize","token":"portable-e28888a7aaffb26ca39d85f6c0554427772d59cb607f61605802c7fe1859c3f0"},"executionOrigin":{"workflow":{"hash":"20c0b8f15998b9da37fbed5b602f669f2a5c7a91f576d5683229c7c5a445a6be","id":"comet-native","version":"1"}},"id":"admin-backup:14","input":{"input":{"artifactRootRef":"docs","name":"admin-backup"},"outputs":{}},"inputHash":"b79b530cd82aea80efd1af0bd6870597894d45e3e9b301d05022029918a01e36","outcome":{"actionId":"admin-backup:14","attempt":1,"claimToken":"portable-e28888a7aaffb26ca39d85f6c0554427772d59cb607f61605802c7fe1859c3f0","inputHash":"b79b530cd82aea80efd1af0bd6870597894d45e3e9b301d05022029918a01e36","outcomeId":"admin-backup:14:1:executor-result","output":{"archiveRef":"2026-11-09-admin-backup","change":"admin-backup","reportSha256":"34fc4d591ccac476109509066898d317ac3b3f7563c4d29ae68bb3643b00a9ba","runId":"admin-backup","specs":[{"capability":"admin-backup","resultHash":"e048ac074f448eef33beac3439f16d7d66d8a9f756032e618c9f4a9233249376"}],"stateVersion":10,"transactionId":"92040fb5-936b-4d4c-b477-3dad04281329"},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"785336fc6fc28fa56566552e67a0ff2cde5df001f1b6c3a3100ade8e5fb24794","outcomeId":"admin-backup:14:1:executor-result"}],"reconciliations":[],"ref":"native-archive-finalize","requiredCapabilities":[],"retry":"manual","runId":"admin-backup","status":"succeeded","stepId":"archive.finalize","type":"call_tool"}],"actionContexts":{"admin-backup:1":{"results":{},"sequence":1},"admin-backup:11":{"results":{},"sequence":11},"admin-backup:12":{"results":{},"sequence":12},"admin-backup:13":{"results":{},"sequence":13},"admin-backup:14":{"results":{},"sequence":14},"admin-backup:3":{"results":{},"sequence":3},"admin-backup:5":{"results":{},"sequence":5},"admin-backup:6":{"results":{},"sequence":6},"admin-backup:7":{"results":{},"sequence":7},"admin-backup:8":{"results":{},"sequence":8},"admin-backup:9":{"results":{},"sequence":9}},"waits":[{"id":"admin-backup:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"admin-backup"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：管理员在「备份」页点击「立即备份」，页面进入生成中状态并禁用按钮；生成完成后列表出现新条目，显示文件名（`keepsake-backup-YYYYMMDD-HHMMSS.zip`）、大小与创建时间，且 `{BACKUP_DIR}` 下存在同名文件。"},{"id":"A2","source":"brief.md","text":"A2：下载并解压备份包，包含 `journey.db`、`manifest.json` 和 `uploads/` 下全部上传对象；用 SQLite 打开 `journey.db` 能看到备份前创建的旅行、照片与站点设置数据；包内不包含 `.env`、Redis 数据文件或备份目录自身。"},{"id":"A3","source":"brief.md","text":"A3：`manifest.json` 的 schema、创建时间、环境、存储驱动、数据库字节数、文件数量与总字节和实际包内内容一致，并列出全部对象 key 与字节数。"},{"id":"A4","source":"brief.md","text":"A4：备份生成期间站点仍可正常写入（新增旅行或照片记录不报错）；备份包中的数据库是一致快照，单独打开即可读取，不需要 `-wal`/`-shm` 伴生文件。"},{"id":"A5","source":"brief.md","text":"A5：模拟对象读取失败或写包失败时，创建接口/状态返回失败原因，列表中不出现该备份，备份目录不残留半成品或临时文件。"},{"id":"A6","source":"brief.md","text":"A6：已有备份正在生成时再次触发备份返回 409（页面按钮禁用），不会并行产生两份备份。"},{"id":"A7","source":"brief.md","text":"A7：备份列表按创建时间倒序；点击下载得到 `application/zip` 附件且文件名与列表一致；删除需确认，删除后列表条目与磁盘文件同时消失；包含 `..`、绝对路径或不符合备份命名的名称被拒绝（400/404），且备份目录之外的文件不受影响。"},{"id":"A8","source":"brief.md","text":"A8：未登录管理员访问备份列表、创建、下载、删除均返回 401 `auth_required`；携带跨站 `Origin` 的创建/删除请求返回 403。"},{"id":"A9","source":"brief.md","text":"A9：存储驱动为 `cos` 时，备份包包含桶内全部对象（分页列出并逐对象下载），`manifest.json` 的 `storage_driver` 为 `cos`；任一对象读取失败时整次备份失败且不生成备份文件。"},{"id":"A10","source":"brief.md","text":"A10：`cd server && go build ./... && go test ./...` 通过；`cd web && npx vue-tsc --noEmit -p tsconfig.app.json && npx vite build` 通过。"},{"id":"A11","source":"brief.md","text":"A11：`.env.example` 与 docker-compose 提供 `BACKUP_DIR` 说明和默认值；README 记录默认备份目录、包内内容、排除项与手工恢复步骤，按文档可完成数据库与上传文件的恢复。"},{"id":"A12","source":"brief.md","text":"备份目录必须位于持久卷上；默认 `{DATA_DIR}/backups`，容器内即 `/data/backups`，随现有 `./data:/data` 挂载保留。"},{"id":"A13","source":"brief.md","text":"数据库快照必须通过 SQLite 在线快照能力（`VACUUM INTO`）生成，禁止直接复制 `.db`、`-wal`、`-shm`。"},{"id":"A14","source":"brief.md","text":"同一时刻只允许一个备份任务；备份在后台 goroutine 中执行，HTTP 请求返回后继续运行，进程重启会中断进行中的任务并清理临时文件。"},{"id":"A15","source":"brief.md","text":"存储对象路径必须复用现有 key 语义：本地 `STORAGE_DIR` 相对路径、COS 对象 key；包内统一放在 `uploads/` 前缀下，禁止目录穿越。"},{"id":"A16","source":"brief.md","text":"本地文件枚举跳过 `.upload-*` 上传临时文件、`.DS_Store` 与非普通文件；`.secret` 作为存储根文件正常收录。"},{"id":"A17","source":"brief.md","text":"备份包包含密码哈希、站点口令哈希与全部私人照片，接口仅管理员可访问，日志不得输出包内容或敏感配置。"},{"id":"A18","source":"brief.md","text":"备份生成失败时不得发布半成品：先写入 `.tmp` 文件，成功后原子重命名，失败与启动时清理。"},{"id":"A19","source":"brief.md","text":"COS 模式必须处理分页与空桶；空桶时备份仍成功，清单文件数量为 0。"},{"id":"A20","source":"brief.md","text":"生成方式：异步任务 + 前端轮询状态。大备份或 COS 下载可能持续数分钟，同步请求会撞上 HTTP 写超时；异步也让用户离开页面后任务继续。"},{"id":"A21","source":"brief.md","text":"留存位置与策略：服务端 `{BACKUP_DIR}` 留存，手动删除，不自动保留最近 N 份；由用户在页面上管理。"},{"id":"A22","source":"brief.md","text":"包格式：zip。跨平台可直接解压查看，媒体文件本身已压缩，按存储方式写入以节省 CPU。"},{"id":"A23","source":"brief.md","text":"对象来源抽象：备份服务只依赖「列出对象 + 打开读取流」两个能力，本地磁盘与 COS 各实现一份，未启用存储时为空实现；便于用假对象源覆盖异常路径。"},{"id":"A24","source":"brief.md","text":"清单：`manifest.json` 记录 schema、创建时间、运行环境、存储驱动、数据库统计、对象列表与排除项，供人工核对与后续恢复工具使用。"},{"id":"A25","source":"brief.md","text":"恢复：本次只写 README 手工步骤（停服务 → 解压覆盖数据库与上传目录 → 启动），不做页面导入。"},{"id":"A26","source":"brief.md","text":"Go 门禁：`cd server && go build ./... && go test ./...`，新增单测覆盖 `store.SnapshotTo`、备份服务打包/清单/失败清理/并发/路径校验，以及 COS 对象分页列出的桩测试。"},{"id":"A27","source":"brief.md","text":"前端门禁：`cd web && npx vue-tsc --noEmit -p tsconfig.app.json && npx vite build`；不使用 `npm run build`，避免 `vue-tsc -b` 改写被 Git 跟踪的 `tsconfig.app.tsbuildinfo`。"},{"id":"A28","source":"brief.md","text":"端到端：使用本地存储后端与临时数据目录，通过 API 创建备份、轮询完成、下载 zip、解开核对数据库与文件、删除并确认磁盘清理；同时覆盖未登录 401、跨站 Origin 403 与非法备份名。"},{"id":"A29","source":"brief.md","text":"浏览器手测：登录管理端进入「备份」页，验证生成中状态、完成刷新、下载文件名、删除确认与错误提示。"}],"children":null,"formalHash":"2456d133ceed3ecc25f38924770d08f