下全部上传对象；用 SQLite 打开 `journey.db` 能看到备份前创建的旅行、照片与站点设置数据；包内不包含 `.env`、Redis 数据文件或备份目录自身。"},{"id":"A3","source":"brief.md","text":"A3：`manifest.json` 的 schema、创建时间、环境、存储驱动、数据库字节数、文件数量与总字节和实际包内内容一致，并列出全部对象 key 与字节数。"},{"id":"A4","source":"brief.md","text":"A4：备份生成期间站点仍可正常写入（新增旅行或照片记录不报错）；备份包中的数据库是一致快照，单独打开即可读取，不需要 `-wal`/`-shm` 伴生文件。"},{"id":"A5","source":"brief.md","text":"A5：模拟对象读取失败或写包失败时，创建接口/状态返回失败原因，列表中不出现该备份，备份目录不残留半成品或临时文件。"},{"id":"A6","source":"brief.md","text":"A6：已有备份正在生成时再次触发备份返回 409（页面按钮禁用），不会并行产生两份备份。"},{"id":"A7","source":"brief.md","text":"A7：备份列表按创建时间倒序；点击下载得到 `application/zip` 附件且文件名与列表一致；删除需确认，删除后列表条目与磁盘文件同时消失；包含 `..`、绝对路径或不符合备份命名的名称被拒绝（400/404），且备份目录之外的文件不受影响。"},{"id":"A8","source":"brief.md","text":"A8：未登录管理员访问备份列表、创建、下载、删除均返回 401 `auth_required`；携带跨站 `Origin` 的创建/删除请求返回 403。"},{"id":"A9","source":"brief.md","text":"A9：存储驱动为 `cos` 时，备份包包含桶内全部对象（分页列出并逐对象下载），`manifest.json` 的 `storage_driver` 为 `cos`；任一对象读取失败时整次备份失败且不生成备份文件。"},{"id":"A10","source":"brief.md","text":"A10：`cd server && go build ./... && go test ./...` 通过；`cd web && npx vue-tsc --noEmit -p tsconfig.app.json && npx vite build` 通过。"},{"id":"A11","source":"brief.md","text":"A11：`.env.example` 与 docker-compose 提供 `BACKUP_DIR` 说明和默认值；README 记录默认备份目录、包内内容、排除项与手工恢复步骤，按文档可完成数据库与上传文件的恢复。"}],"children":null,"formalHash":"59b852bb253be0af85f7c1acacf7dbe251efe2ded959109ec59160b32adc87e4","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"64ad45fb80fdc24a18ad1bb2810bea276f93ff83d23347f87c4b131b7b2435ea","contractHash":"d6c9ab0e972e09c68922bc49d815fad1d8966dd906d7c7a3cc9dfadde661cca2","inputHash":"e0d77180120ebf33ac65a0313bdb9e3b3da4ec28b42655d044680b2792347b8f","legacyFingerprint":"17a1412aaaf7ad11bb27556b4ccdefe6ca25f2a1e1ed7d146026b41c7aeb697a","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e048ac074f448eef33beac3439f1