wal/-shm，包含备份前数据、不包含备份期间新增的旅行，验证了时间点一致性与写入不受阻塞。","truncated":false},"result":"passed","source":"brief.md","text":"A4：备份生成期间站点仍可正常写入（新增旅行或照片记录不报错）；备份包中的数据库是一致快照，单独打开即可读取，不需要 `-wal`/`-shm` 伴生文件。"},{"id":"A5","reason":{"text":"backup.go:358-423 在 defer 中删除临时快照与临时 zip；真实进程将上传对象设为不可读后触发备份，状态接口返回 last.status=failed 且 error 含 permission denied，列表为空，备份目录无 .zip/.tmp 残留；TestFailureLeavesNoPartialBackup 通过。","truncated":false},"result":"passed","source":"brief.md","text":"A5：模拟对象读取失败或写包失败时，创建接口/状态返回失败原因，列表中不出现该备份，备份目录不残留半成品或临时文件。"},{"id":"A6","reason":{"text":"backup.go:219-238 在 Start 内互斥占用 running；handler:25-35 将 ErrRunning 映射为 409 backup_running；页面 :disabled=busy||running。真实进程在备份进行中第二次 POST 返回 409，未并行生成第二份备份，且期间站点写入成功。","truncated":false},"result":"passed","source":"brief.md","text":"A6：已有备份正在生成时再次触发备份返回 409（页面按钮禁用），不会并行产生两份备份。"},{"id":"A7","reason":{"text":"backup.go:278-356 实现倒序列表、名称正则、Open/Delete 普通文件校验；handler:38-66 返回 application/zip 附件与 deleted。实测下载文件名与列表一致、列表按 created_at 倒序；浏览器实测删除弹出确认，确认后列表条目与磁盘文件同时消失；bad.zip、../、绝对路径、反斜杠名称均 400，备份目录外文件未受影响。","truncated":false},"result":"passed","source":"brief.md","text":"A7：备份列表按创建时间倒序；点击下载得到 `application/zip` 附件且文件名与列表一致；删除需确认，删除后列表条目与磁盘文件同时消失；包含 `..`、绝对路径或不符合备份命名的名称被拒绝（400/404），且备份目录之外的文件不受影响。"},{"id":"A8","reason":{"text":"api.go:69-73 备份路由位于 withAdmin 组，router.go:52 以 csrfSameOrigin 包裹；实测未登录访问列表/创建/下载/删除均 401 auth_required，携带跨站 Origin 的创建/删除均 403 csrf_rejected。","truncated":false},"result":"passed","source":"brief.md","text":"A8：未登录管理员访问备份列表、创建、下载、删除均返回 401 `auth_required`；携带跨站 `Origin` 的创建/删除请求返回 403。"},{"id":"A9","reason":{"text":"cosutil.go:104-128 按 IsTruncated/NextMarker 分页，缺 marker 报错；cosutil_test 的 TestListAllObjectsPaginates/TestListAllObjectsRejectsTruncatedWithoutMarker 与 backup_test 的 TestManifestRecordsCosDriver 均通过；backup.go:470-496 逐对象 OpenObject，任一读取失败使整次失败且 defer 清理不发布文件。未连接真实 COS 桶，按已知限制以桩测试覆盖。","truncated":false},"result":"passed","source":"brief.md","text":"A9：存储驱动为 `cos` 时，备份包包含桶内全部对象（分页列出并逐对象下载），`manifest.