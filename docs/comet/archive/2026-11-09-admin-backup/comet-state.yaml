内统一放在 `uploads/` 前缀下，禁止目录穿越。"},{"id":"A16","source":"brief.md","text":"本地文件枚举跳过 `.upload-*` 上传临时文件、`.DS_Store` 与非普通文件；`.secret` 作为存储根文件正常收录。"},{"id":"A17","source":"brief.md","text":"备份包包含密码哈希、站点口令哈希与全部私人照片，接口仅管理员可访问，日志不得输出包内容或敏感配置。"},{"id":"A18","source":"brief.md","text":"备份生成失败时不得发布半成品：先写入 `.tmp` 文件，成功后原子重命名，失败与启动时清理。"},{"id":"A19","source":"brief.md","text":"COS 模式必须处理分页与空桶；空桶时备份仍成功，清单文件数量为 0。"},{"id":"A20","source":"brief.md","text":"生成方式：异步任务 + 前端轮询状态。大备份或 COS 下载可能持续数分钟，同步请求会撞上 HTTP 写超时；异步也让用户离开页面后任务继续。"},{"id":"A21","source":"brief.md","text":"留存位置与策略：服务端 `{BACKUP_DIR}` 留存，手动删除，不自动保留最近 N 份；由用户在页面上管理。"},{"id":"A22","source":"brief.md","text":"包格式：zip。跨平台可直接解压查看，媒体文件本身已压缩，按存储方式写入以节省 CPU。"},{"id":"A23","source":"brief.md","text":"对象来源抽象：备份服务只依赖「列出对象 + 打开读取流」两个能力，本地磁盘与 COS 各实现一份，未启用存储时为空实现；便于用假对象源覆盖异常路径。"},{"id":"A24","source":"brief.md","text":"清单：`manifest.json` 记录 schema、创建时间、运行环境、存储驱动、数据库统计、对象列表与排除项，供人工核对与后续恢复工具使用。"},{"id":"A25","source":"brief.md","text":"恢复：本次只写 README 手工步骤（停服务 → 解压覆盖数据库与上传目录 → 启动），不做页面导入。"},{"id":"A26","source":"brief.md","text":"Go 门禁：`cd server && go build ./... && go test ./...`，新增单测覆盖 `store.SnapshotTo`、备份服务打包/清单/失败清理/并发/路径校验，以及 COS 对象分页列出的桩测试。"},{"id":"A27","source":"brief.md","text":"前端门禁：`cd web && npx vue-tsc --noEmit -p tsconfig.app.json && npx vite build`；不使用 `npm run build`，避免 `vue-tsc -b` 改写被 Git 跟踪的 `tsconfig.app.tsbuildinfo`。"},{"id":"A28","source":"brief.md","text":"端到端：使用本地存储后端与临时数据目录，通过 API 创建备份、轮询完成、下载 zip、解开核对数据库与文件、删除并确认磁盘清理；同时覆盖未登录 401、跨站 Origin 403 与非法备份名。"},{"id":"A29","source":"brief.md","text":"浏览器手测：登录管理端进入「备份」页，验证生成中状态、完成刷新、下载文件名、删除确认与错误提示。"}],"children":null,"formalHash":"2456d133ceed3ecc25f38924770d08fb8ead8a610162de6d057846dc0932d0be","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2ce437459bd17cc512895ef331a8d54cae0c29b21f10e71f3b91e447d6501d26","contractHash":"b8c1508c346d3af5b3f37932aaf7248f2b22ec94615ff9635bf1