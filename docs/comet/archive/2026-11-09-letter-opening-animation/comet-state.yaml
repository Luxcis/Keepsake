acceptance:
  - id: A1
    source: brief.md
    text: A1：点击「拆开这封信
      ✉」后，先看到信封封口向上翻开，信封本体仍留在原位；随后一部分折起的空白信纸（纸面无文字）从信封内向上露出，信封此时仍完整可见。
    result: passed
    reason:
      text: "0-420ms 仅封口 rotateX 由 0 翻到 -180 度（transform m33: 1→0.694→-0.694→-1），信封正面
        opacity=1、translateY=0 始终留在原位；420-920ms 信纸层 translateY 由 157px 升到
        -58px（折叠高 115px），信封上沿露出 58px（约折叠高度的 50%）；此时 paper-inner
        opacity=0，纸面无文字，信封正面 opacity=1、y=0 完整可见。截图 10-a1-flap-200ms /
        11-a1-paper-revealed-920ms 与之吻合。"
      truncated: false
  - id: A2
    source: brief.md
    text: A2：信纸继续向上完全抽出（信纸下沿高于信封上沿），信封同时向下移动并逐渐淡出至完全不可见；抽出过程中信纸始终显示在信封之上，不被信封遮挡。
    result: passed
    reason:
      text: 980-1580ms 信纸层 y 由 -58px 升到 -135px；1580ms 时信纸下沿（-17.5px）已高于信封上沿，1630ms
        时下沿高于信封上沿约 9px 且信封已下移 56px；信封各层 980-1630ms translateY 0→56px、opacity
        1→0（1630ms front/flap/label 均为 0）。信纸层 z-index=1，封口在 250ms 翻到侧面时切到
        z-index=0，露出的纸面始终绘制在信封与封口之上（1250ms
        截图可见纸带覆盖在信封与翻盖之上）；仍在信封内部的下半部分被信封正面遮住，符合“从信封内抽出”的物理层次。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：信纸完全抽出后，折叠的空白信纸向下展开为完整信纸，展开过程中随纸面展开显示出正文，展开完成后标题、全部正文段落、日期与落款完整可见，文字与纸面背景均未被裁切，折痕消失。
    result: passed
    reason:
      text: 1500-2350ms clip 高度由 115px 增长到 739px，内层正文 opacity 0→1（1680ms 起淡入，2100ms 达
        1），折痕 opacity 在 2030ms 降为 0；1900ms 截图中正文随纸面展开逐渐显现。完成后切换为真实
        article：标题「写给你的第七封信」、7 段正文、日期 2026.11.09、落款「永远爱你的那个人」全部可见；最终 article 高
        740px、无 overflow 裁切，纸面背景完整。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：动画结束后页面稳定为与改动前一致的阅读版式（信纸宽度等于父容器宽度且不超过
      448px，留白与行距不变），没有残留的信封元素或空白占位，信纸不出现位置突跳。
    result: passed
    reason:
      text: 完成前 2300ms 动画纸面 top=473.89px、left=416、w=448、h=739，页面 scrollHeight=1496；完成后
        2350ms 最终 article top=474、left=416、w=448、h=740，scrollHeight 仍为
        1496，无位置/高度突跳。场景、按钮与 spacer
        全部移除（stagePresent=false、btnPresent=false、articleCount=1）。最终信纸宽度
        448px≤448px（375/768 视口下为 335/448px，等于父容器内容宽），padding 40px（375 下 20px）、正文
        line-height 32px，与原 article 的类名和内容一致。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：系统开启「减少动效」或 GSAP 模块加载失败时，点击「拆开这封信」后直接显示完整信纸，不播放任何动画阶段，信件可正常阅读。
    result: passed
    reason:
      text: "覆盖 matchMedia 令 (prefers-reduced-motion: reduce) 命中后点击：仅触发 1 次 reduce
        查询，无 motion-ready、无 GSAP 内联样式，信封与按钮立即移除，直接显示完整信纸（7 段正文、title、日期、落款；top
        474、w 448、h 740），无动画阶段。另将 web/dist 复制到 /tmp 并移除 gsap 分块（该请求返回 text/html
        导致模块加载失败），点击后同样直接显示完整信纸、无动画、无未捕获错误。"
      truncated: false
  - id: A6
