0（1630ms front/flap/label 均为 0）。信纸层 z-index=1，封口在 250ms 翻到侧面时切到 z-index=0，露出的纸面始终绘制在信封与封口之上（1250ms 截图可见纸带覆盖在信封与翻盖之上）；仍在信封内部的下半部分被信封正面遮住，符合“从信封内抽出”的物理层次。","result":"passed"},{"id":"A3","reason":"1500-2350ms clip 高度由 115px 增长到 739px，内层正文 opacity 0→1（1680ms 起淡入，2100ms 达 1），折痕 opacity 在 2030ms 降为 0；1900ms 截图中正文随纸面展开逐渐显现。完成后切换为真实 article：标题「写给你的第七封信」、7 段正文、日期 2026.11.09、落款「永远爱你的那个人」全部可见；最终 article 高 740px、无 overflow 裁切，纸面背景完整。","result":"passed"},{"id":"A4","reason":"完成前 2300ms 动画纸面 top=473.89px、left=416、w=448、h=739，页面 scrollHeight=1496；完成后 2350ms 最终 article top=474、left=416、w=448、h=740，scrollHeight 仍为 1496，无位置/高度突跳。场景、按钮与 spacer 全部移除（stagePresent=false、btnPresent=false、articleCount=1）。最终信纸宽度 448px≤448px（375/768 视口下为 335/448px，等于父容器内容宽），padding 40px（375 下 20px）、正文 line-height 32px，与原 article 的类名和内容一致。","result":"passed"},{"id":"A5","reason":"覆盖 matchMedia 令 (prefers-reduced-motion: reduce) 命中后点击：仅触发 1 次 reduce 查询，无 motion-ready、无 GSAP 内联样式，信封与按钮立即移除，直接显示完整信纸（7 段正文、title、日期、落款；top 474、w 448、h 740），无动画阶段。另将 web/dist 复制到 /tmp 并移除 gsap 分块（该请求返回 text/html 导致模块加载失败），点击后同样直接显示完整信纸、无动画、无未捕获错误。","result":"passed"},{"id":"A6","reason":"openLetter 在 await 前同步置 phase=animating；同一 tick 连续 2 次 click 事件只产生一条时间线（500ms 时 layerY=69.431，与单次运行基准一致）。在 500ms 处强制移除 disabled 属性后再点按钮 2 次并依次点击信封、纸层、信封正面，状态仍为 69.431 不变；继续推进到 920ms 得到 layerY=-58、front opacity=1、frontY=0，与单次基准完全一致，无重启或跳帧。完成后场景与按钮不存在；scrollHeight=1496>900，scrollTo(0,500) 在下一帧生效（scrollY=500，截图可见滚动条），页面可正常滚动阅读。","result":"passed"},{"id":"A7","reason":"在 375/768/1280 三种视口完整跑完动画：各阶段 documentElement.scrollWidth 均等于 innerWidth（375/768/1280）；信封、纸层与最终信纸同宽（分别为 335/448/448px）并左右居中（375: 左右各 20px；768: 各 160px；1280: 各 416px），无横向溢出、无两侧空隙；A1/A2 阶段纸面均在视口内，最终 article 宽度为 min(448, 父内容宽)，375 下 335px 恰好填满父内容区。","result":"passed"}],"attempt":1,"iteration":1,"risks":["开封时翻盖向上翻到信封卡片上沿之上，会遮住页面引导段落的部分文字（375/768/1280 截图均可见），因为 .envelope-stage 去掉了 overflow-hidden 以便信纸升起；该遮挡不属于 A1-A7 明确验收项，但属于视觉副作用。",".envelope-button 带有 Tailwind transition，GSAP 对 opacity 的逐帧写入