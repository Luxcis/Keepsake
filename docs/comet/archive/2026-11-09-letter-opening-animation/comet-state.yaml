        layerY=-58、front
        opacity=1、frontY=0，与单次基准完全一致，无重启或跳帧。完成后场景与按钮不存在；scrollHeight=1496>900，scrollTo(0,500)
        在下一帧生效（scrollY=500，截图可见滚动条），页面可正常滚动阅读。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：在手机（375px）、平板（768px）与桌面（1280px）视口下，开信动画各阶段与展开后的信纸都完整显示，无横向溢出、无两侧空隙。
    result: passed
    reason:
      text: "在 375/768/1280 三种视口完整跑完动画：各阶段 documentElement.scrollWidth 均等于
        innerWidth（375/768/1280）；信封、纸层与最终信纸同宽（分别为 335/448/448px）并左右居中（375: 左右各
        20px；768: 各 160px；1280: 各 416px），无横向溢出、无两侧空隙；A1/A2 阶段纸面均在视口内，最终 article
        宽度为 min(448, 父内容宽)，375 下 335px 恰好填满父内容区。"
      truncated: false
