","text":"A1：点击「拆开这封信 ✉」后，先看到信封封口向上翻开，信封本体仍留在原位；随后一部分折起的空白信纸（纸面无文字）从信封内向上露出，信封此时仍完整可见。"},{"id":"A2","source":"brief.md","text":"A2：信纸继续向上完全抽出（信纸下沿高于信封上沿），信封同时向下移动并逐渐淡出至完全不可见；抽出过程中信纸始终显示在信封之上，不被信封遮挡。"},{"id":"A3","source":"brief.md","text":"A3：信纸完全抽出后，折叠的空白信纸向下展开为完整信纸，展开过程中随纸面展开显示出正文，展开完成后标题、全部正文段落、日期与落款完整可见，文字与纸面背景均未被裁切，折痕消失。"},{"id":"A4","source":"brief.md","text":"A4：动画结束后页面稳定为与改动前一致的阅读版式（信纸宽度等于父容器宽度且不超过 448px，留白与行距不变），没有残留的信封元素或空白占位，信纸不出现位置突跳。"},{"id":"A5","source":"brief.md","text":"A5：系统开启「减少动效」或 GSAP 模块加载失败时，点击「拆开这封信」后直接显示完整信纸，不播放任何动画阶段，信件可正常阅读。"},{"id":"A6","source":"brief.md","text":"A6：动画进行期间重复点击「拆开这封信」不会重启动画或产生跳帧；动画完成后信封与按钮不再出现，页面可正常滚动阅读。"},{"id":"A7","source":"brief.md","text":"A7：在手机（375px）、平板（768px）与桌面（1280px）视口下，开信动画各阶段与展开后的信纸都完整显示，无横向溢出、无两侧空隙。"},{"id":"A8","source":"brief.md","text":"触发方式沿用现有「拆开这封信 ✉」按钮作为唯一触发点，信封卡片本身不额外绑定点击。"},{"id":"A9","source":"brief.md","text":"折叠信纸的折叠高度以信封卡片高度为参照（约占卡片高度的 40%），折叠态与展开态宽度一致（等于信纸最终宽度），避免展开时文字重排。"},{"id":"A10","source":"brief.md","text":"展开阶段直接使用真实信纸内容（`LetterCard`），动画结束后由同一内容接管为常规阅读版式，不保留动画副本。"},{"id":"A11","source":"brief.md","text":"动画分为四段：翻盖打开 → 露出折叠信纸 → 信纸抽出且信封下移淡出 → 信纸展开到位；整套动画约 2.2 秒。"},{"id":"A12","source":"brief.md","text":"折叠与抽出阶段信纸纸面保持空白、不显示文字；展开阶段纸面变高的同时淡入正文，展开完成时正文全部可见（Q1 答复）。"},{"id":"A13","source":"brief.md","text":"折叠态纸面用与最终信纸一致的底色和纸纹，仅靠折痕表达折叠，不预先显示抬头、标题或段落。"},{"id":"A14","source":"brief.md","text":"前端门禁：`cd web && npx vue-tsc --noEmit -p tsconfig.app.json` 与 `npx vite build` 通过（不使用会改写构建缓存的 `npm run build`）。"},{"id":"A15","source":"brief.md","text":"行为与视觉验收：用临时复制的 SQLite 数据库与本地存储启动 Go API 与 Vite 预览，在浏览器中检查四个动画阶段的画面、抽纸遮挡关系、展开后的版式、重复点击、以及减少动效降级。"},{"id":"A16","source":"brief.md","text":"多视口：375px、768px、1280px 三种宽度下各检查一次信封与信纸的显示。"}],"children":null,"formalHash":"709045f6ca25c0d12e89ae2a849613d8e7f311439396436c5c5e43e0adde9cee","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"a519fc89f5221c82a8871cfa369544c9722