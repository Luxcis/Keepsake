片高度的 40%），折叠态与展开态宽度一致（等于信纸最终宽度），避免展开时文字重排。"},{"id":"A10","source":"brief.md","text":"展开阶段直接使用真实信纸内容（`LetterCard`），动画结束后由同一内容接管为常规阅读版式，不保留动画副本。"},{"id":"A11","source":"brief.md","text":"动画分为四段：翻盖打开 → 露出折叠信纸 → 信纸抽出且信封下移淡出 → 信纸展开到位；整套动画约 2.2 秒。"},{"id":"A12","source":"brief.md","text":"折叠与抽出阶段信纸纸面保持空白、不显示文字；展开阶段纸面变高的同时淡入正文，展开完成时正文全部可见（Q1 答复）。"},{"id":"A13","source":"brief.md","text":"折叠态纸面用与最终信纸一致的底色和纸纹，仅靠折痕表达折叠，不预先显示抬头、标题或段落。"},{"id":"A14","source":"brief.md","text":"前端门禁：`cd web && npx vue-tsc --noEmit -p tsconfig.app.json` 与 `npx vite build` 通过（不使用会改写构建缓存的 `npm run build`）。"},{"id":"A15","source":"brief.md","text":"行为与视觉验收：用临时复制的 SQLite 数据库与本地存储启动 Go API 与 Vite 预览，在浏览器中检查四个动画阶段的画面、抽纸遮挡关系、展开后的版式、重复点击、以及减少动效降级。"},{"id":"A16","source":"brief.md","text":"多视口：375px、768px、1280px 三种宽度下各检查一次信封与信纸的显示。"}],"children":null,"formalHash":"709045f6ca25c0d12e89ae2a849613d8e7f311439396436c5c5e43e0adde9cee","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"a519fc89f5221c82a8871cfa369544c9722f01bdfae94f61478323bd273becf4","contractHash":"7673b90b9711bd2fb0c8702211968662cabfef94d32891a6198e4360c0b6cea3","inputHash":"7070821d9b43c0c9db65abbb7e21f55fdc3e1456376ac773c3bcd921bf548f2b","legacyFingerprint":"2d86dc9d0de47caa05f3d04ba65a134ccb005b19c4b0c88bf4027970fc3d9377","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"0d6286fff85eaf72ea1bea4a9daa00bd1a439f19d2b0ffe8114a1c200b56e4de","contractHash":"701289af572c2b0e7e114fd678e94f7c2f22eaf18f449f403a3d1bada0f4b2f4","inputHash":"cea8c97d9f53d76e441447fa960b75c92cbc27d75b30f7edb62e8376b5d4c25c","legacyFingerprint":"d4eed7c50278b72f3a4c2c8292ea7ab2a6ebe6cca8338e77ef614f8495706167","source":"specs/letter-opening/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"f5a77478b972f0d3ebae96dbfad72399e33ea6e27f064126f8e1b2f451a119d0","specChanges