acceptance:
  - id: A1
    source: brief.md
    text: 管理端旅行列表的每一行显示「置顶」或「取消置顶」按钮；点击置顶后该行显示已置顶标识，点击取消置顶后不再有任何旅行处于置顶状态。
    result: passed
    reason:
      text: AdminTripsView.vue:397-405 在每个旅行行内渲染按钮，文案随 t.pinned 显示「取消置顶/置顶」；:392 在
        t.pinned 时输出「已置顶」标识；togglePin（152-161）PUT /api/admin/trips/{id}/pin 成功后
        load() 重拉管理列表。独立 E2E（/tmp 临时 DATA_DIR 启动真实服务）：pin A 返回 200 且 admin 列表
        A.pinned=true；对唯一置顶旅行取消置顶后 admin 列表全部 pinned=false。
      truncated: false
  - id: A2
    source: brief.md
    text: 置顶新旅行时，原置顶旅行自动取消置顶，列表中始终最多只有一个旅行显示已置顶。
    result: passed
    reason:
      text: SetTripPinned（queries_admin.go:212-244）在同一事务内先 UPDATE trips SET
        is_pinned=0 WHERE is_pinned=1 AND id<>?
        再设置目标行；migrations/0007_trip_pinned.sql:6 建立局部唯一索引 idx_trips_pinned ON
        trips(is_pinned) WHERE is_pinned=1。E2E：pin A 后再 pin B，admin 列表
        A=false/B=true，始终只有一个 pinned；另用 sqlite3 执行同一 DDL 后插入两条 is_pinned=1 报
        UNIQUE constraint failed。
      truncated: false
  - id: A3
    source: brief.md
    text: 草稿旅行可以被置顶，列表提示「发布后生效」；此时前台足迹列表与时光轴都不展示该旅行。
    result: passed
    reason:
      text: SetTripPinned 不校验
        status（queries_admin.go:212-244），草稿可置顶；AdminTripsView.vue:392
        草稿置顶显示「已置顶（发布后生效）」；公开 ListTrips 仅 WHERE
        status='published'（queries.go:44-46）。E2E：pin 草稿 D 后 admin 列表
        D.pinned=true，/api/trips 完全不含 D；发布 D 后公开列表出现 D 且 pinned=true；改回草稿后再次消失。
      truncated: false
  - id: A4
    source: brief.md
    text: 已发布的置顶旅行不出现在 `/trips` 的足迹卡片列表中，足迹卡片编号只按实际展示的旅行从 01 连续计数。
    result: passed
    reason:
      text: TripsView.vue:11 visibleTrips=trips.filter(t=>!t.pinned)；:81-83 仅遍历
        visibleTrips 渲染卡片；:100 编号为 String(i+1).padStart(2,'0')，按过滤后索引从 01
        连续计数；:75 空态按 visibleTrips.length 判定。公开接口 ListTrips 扫描 is_pinned 并由
        marshal.go:35 输出 pinned（queries.go:44-57）。
      truncated: false
  - id: A5
    source: brief.md
    text: 时光轴最顶部单独显示置顶旅行节点，该节点不显示出发日期与结束日期，仍显示标题、简介与封面并可点击进入旅行详情；该旅行不在下方按日期排序的普通节点中重复出现。
    result: passed
    reason:
      text: TimelineView.vue:12-16 timelineNodes=[pinned,...regular]，pinned 用 find
        取唯一置顶、regular 用 filter 排除 pinned，故不会重复出现；:125-126 所有节点均为 RouterLink 进入
        /trips/:id；:137 仅 !trip.pinned 时渲染
        formatDateRange，置顶节点不显示出发/结束日期；标题、简介、封面在 :138-155，无封面回退 photo-card 渐变占位。
      truncated: false
  - id: A6
    source: brief.md
    text: 取消置顶后，该旅行回到足迹列表与时光轴中按出发日期排序的位置；置顶旅行改为草稿后，时光轴顶部的置顶节点消失。
    result: passed
    reason:
      text: E2E：对唯一置顶 D 取消置顶后 admin 全部 pinned=false，/api/trips 按 start_date DESC 返回
        C(2024-03)、B(2024-02)，D 作为草稿不可见；草稿 D 置顶时公开列表不含 D，发布后才出现
        pinned=true，再改草稿即从公开数据源消失。TripsView.vue:83 与 TimelineView.vue:12-16
        均直接消费该已排序列表，取消置顶后回到日期排序位置，顶部置顶节点消失。
      truncated: false
  - id: A7
    source: brief.md
    text: 删除当前置顶旅行后，页面不报错，时光轴顶部不再显示置顶节点，其余旅行的展示顺序不变。
    result: passed
    reason:
      text: E2E：pin A 后 DELETE /api/admin/trips/A 返回 200，admin 列表无
        pinned=true，/api/trips 仍按原顺序返回 C、B；TimelineView.vue:12-16 在无 pinned 时
        timelineNodes 退化为 regular 列表，不会渲染置顶节点，页面无对已删除 ID 的引用，不会报错。
      truncated: false
  - id: A8
    source: brief.md
    text: 旅行编辑表单只读显示当前置顶状态，不提供第二个置顶开关。
    result: passed
    reason:
      text: AdminTripsView.vue:280-285 编辑表单只输出只读文本「置顶状态：已置顶/未置顶（在下方旅行列表行内设置）」，表单内无
        pinned 输入控件；save() 载荷（:120-137）不含 pinned；全仓库 grep 显示唯一写入口是列表行按钮
        togglePin（152-161、397-405），不存在第二个置顶开关。
      truncated: false
  - id: A9
    source: brief.md
    text: 未登录或非管理员会话调用置顶接口被拒绝；对不存在的旅行调用置顶接口返回 404。
    result: passed
    reason:
      text: api.go:52-53 管理组 Use(withAdmin)，:60 注册 PUT
        /admin/trips/{id}/pin；middleware.go:72-86 无管理员 Cookie 时 authRequired 返回
        401（respond.go:62-64）；不存在的旅行由 SetTripPinned 返回
        ErrNotFound（queries_admin.go:218-225），mapStoreErr→NotFound 返回
        404（respond.go:78-87、47-49）。独立 E2E：无 Cookie PUT 返回 401 auth_required；管理员
        Cookie 对不存在 ID 返回 404 not_found；pinned 非布尔返回 400。
      truncated: false
