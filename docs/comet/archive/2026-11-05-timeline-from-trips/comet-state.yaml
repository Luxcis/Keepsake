    source: brief.md
    text: A6：未解锁时 `/timeline` 显示门禁卡片；没有已发布旅行时显示空态提示且文案不再指引去后台补录；加载失败时显示错误与重试入口。
    result: passed
    reason:
      text: TimelineView.vue 在 isGateRequired(gate_required) 时显示 GatePrompt，解锁事件触发
        gate=false 并重新 load()；空态 PageState
        文案为“记录并发布第一段旅行后，这里会自动出现对应的节点。”，不再指引后台补录；加载失败时 PageState
        显示错误信息与“再试一次”按钮，点击 emit retry 调用 load()。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：`cd server && go build ./... && go test ./...` 与 `cd web && npm run
