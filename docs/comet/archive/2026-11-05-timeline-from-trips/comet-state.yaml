      text: AdminView.vue 的 tabs 已无「时光轴」；router/index.ts 已无 admin-timeline 路由且
        /admin/timeline 由 /:pathMatch(.*)* 落到 NotFoundView；AdminTimelineView.vue
        已删除；api.go 已无 /timeline 与 /admin/timeline 路由。TestAdminFullFlow 对 GET
        /api/timeline、POST /api/admin/timeline 断言 404 并通过；另用 Go overlay
        临时测试（不写入仓库）实测 GET/POST/PUT/PATCH/DELETE 访问 /api/timeline 与
        /api/admin/timeline 在匿名和登录态下均返回 404。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：发布一段旅行后打开 `/timeline`，该旅行自动成为一个节点，节点按出发日期从早到晚排列；草稿旅行不产生节点。
    result: passed
    reason:
      text: TimelineView.vue 的 load() 请求 /api/trips，并按 start_date 升序、同日 sort_order
        升序（再以 id 稳定排序）派生节点；节点数与已发布旅行一一对应。queries.go 的 ListTrips 带 WHERE
        status='published'，TestPublicTripsOrderedByDate 中日期更晚的 draft
        未出现在公开列表，测试通过。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：时光轴节点显示出发日期（有结束日期时显示起止范围）、旅行标题、旅行简介和封面缩略图；没有封面时显示占位；点击节点进入 `/trips/:id`。
    result: passed
    reason:
      text: TimelineView.vue 节点显示 formatDateRange(trip)（有 end_date 且不同于 start_date
        时显示“起 – 止”，否则单日期）、trip.title、trip.summary，封面用
        trip.cover_thumb_src，无封面时渲染 .photo-card 渐变占位；节点本身是
        RouterLink，:to=`/trips/${trip.id}`。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：`/trips` 页面的已发布旅行按出发日期从近到远排列（最新在前），同一天出发的旅行按 `sort_order` 升序；草稿旅行不出现。
    result: passed
    reason:
      text: queries.go ListTrips 为 WHERE status='published' ORDER BY start_date DESC,
        sort_order ASC；TripsView.vue
        按接口返回顺序渲染（编号按新顺序）。TestPublicTripsOrderedByDate 构造 2025-05-01、两段
        2026-09-10（sort_order 2 与 5）及 2027-01-01 草稿，断言顺序为 [同日后写, 最新的旅行,
        较早的旅行]，测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：迁移执行后数据库不再存在 `timeline_events` 表，原有手工时光轴记录不再出现在任何页面或接口。
    result: passed
    reason:
      text: 新增 server/internal/store/migrations/0005_drop_timeline_events.sql，内容为 DROP
        TABLE IF EXISTS timeline_events；migrations.go 按文件名排序执行未应用版本并记录
        _migrations，现有库会补执行 0005。TestTimelineEventsTableRemoved 查询 sqlite_master
        断言表不存在并通过；全仓已无 timeline_events 的查询/接口引用（仅 0001 建表历史与 0005 删除、测试断言保留）。
      truncated: false
