acceptance:
  - id: A1
    source: brief.md
    text: 站点已设置未来开放日期时，访客在门禁卡片输入错误口令：卡片内显示「访问口令不正确。」，不出现未开放弹窗。
    result: passed
    reason:
      text: server/internal/handlers/auth.go:26-32 先执行 svc.Unlock（限速+口令校验），口令错误经
        unlockFail 返回 401
        gate_mismatch「访问口令不正确」；web/src/components/GatePrompt.vue:38-41 仅设置卡片内联
        message，不设置 notOpenMessage，故不会渲染
        dialog；server/internal/server/router_test.go:225-233 断言未开放时错误口令返回 401
        gate_mismatch 且响应不含开放日期文案。独立执行 go test ./internal/server -run
        'TestSiteOpenDate|TestUnlockRateLimitedWhileClosed' -count=1 通过。
      truncated: false
  - id: A2
    source: brief.md
    text: 站点已设置未来开放日期时，访客输入正确口令：出现未开放弹窗，弹窗内提示包含具体开放日期；关闭弹窗后仍停留在门禁卡片，私人内容不可见。
    result: passed
    reason:
      text: auth.go:34-42 口令通过后才判断开放日期，未开放返回 403 not_open_yet（携带渲染后提示语）且不发放
        Cookie；server/internal/handlers/site.go:15、35-43 默认文案含 {date} 并替换为「2099
        年 1 月 1 日」。GatePrompt.vue:48-54 将 err.message 写入 notOpenMessage，97-122 以
        Teleport 渲染 role=dialog 弹层（「我知道了」按钮、遮罩 @click.self、window Esc 监听），是前端
        dialog 而非浏览器 alert；closeNotOpen 仅清空 notOpenMessage、不触发
        unlocked，父组件（web/src/views/TripsView.vue:69 等 @unlocked="gate =
        false;load()"）仍保持 gate=true，故关闭后停留门禁卡片且私人内容不可见。router_test.go:235-243 断言
        403 not_open_yet 且响应含具体开放日期。弹窗交互由代码审查确认。
      truncated: false
  - id: A3
    source: brief.md
    text: 管理端配置了自定义未开放提示语（含 `{date}` 占位符）时，口令正确但未开放的弹窗显示替换日期后的完整自定义文案。
    result: passed
    reason:
      text: site.go:37-43 renderNotOpenMessage 将自定义文案中的 {date} 替换为中文日期标签；auth.go:40
        将渲染后的完整文案作为 error.message 返回；client.ts 解析
        error.message，GatePrompt.vue:111 在弹窗中直接插值显示。router_test.go:245-253
        配置自定义文案「先别急，{date} 再见。」后断言响应含「先别急，2099 年 1 月 1 日 再见。」；独立定向测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: 未设置开放日期或开放日期已过时，访客输入正确口令直接解锁并加载页面内容，不出现未开放弹窗。
    result: passed
    reason:
      text: site.go:19-33 open_date 为空、非法或已过时均视为已开放；auth.go:34-50 已开放路径跳过
        not_open_yet，IssueGate 并设置 HttpOnly 门禁 Cookie 返回
        200；GatePrompt.vue:33-35 成功后
        emit('unlocked')，私有页（TimelineView.vue:107、LetterView.vue:129、TripsView.vue:69、TripDetailView.vue:109）以
        @unlocked="gate = false;load()"
        加载内容，不出现未开放弹窗。router_test.go:208-214（过去日期）与
        275-281（清空日期）断言解锁成功并可读内容；独立定向测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 站点未开放期间，错误口令尝试计入限速；连续失败达到上限后提示「尝试次数过多，请稍后再试」，而不是继续提示口令不正确。
    result: passed
    reason:
      text: server/internal/auth/service.go:79-86 限速计数在口令校验之前执行，站点未开放期间的每次错误口令尝试都计入同一
        IP 的 15
        分钟固定窗口（unlockLimitPerWindow=10、unlockLimitWindow=15m，service.go:29-30）；超限后返回
        ErrRateLimited，auth.go:55-57 返回 429
        rate_limited「尝试次数过多，请稍后再试」，GatePrompt.vue:42-44
        内联显示「尝试次数过多，请稍后再试。」而非口令错误文案。router_test.go:284-309
        TestUnlockRateLimitedWhileClosed：10 次错误口令均为 401 gate_mismatch，第 11
        次即使口令正确也返回 429 rate_limited；独立定向测试通过。
      truncated: false
