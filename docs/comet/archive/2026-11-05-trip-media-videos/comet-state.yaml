Right 在 props.photos（照片与视频混合数组）上循环切换(:101-120)，视频因 :key 切换/关闭而卸载停止播放。npx vue-tsc --noEmit -p tsconfig.app.json 独立执行退出码 0。","truncated":false},"result":"passed","source":"brief.md","text":"公开旅行详情中，视频条目与照片按接口返回顺序混排在同一网格；视频卡片显示播放标记，点击后在灯箱内播放，Esc 可关闭，左右方向键可切换到相邻照片或视频。"},{"id":"A4","reason":{"text":"上限常量为视频 400<<20、图片 30<<20(server/internal/config/config.go:15-18)；签名接口按 content_type 选择上限并在 max_bytes 返回对应值(photo.go:46-53,91-96,105-111)；确认阶段按 HEAD 内容类型分别校验 400MB/30MB(photo.go:160-178)，实况 video_key 亦用 400MB(photo.go:200-203)；本地存储单对象放行到 400MB(server/cmd/server/main.go:164-170)、nginx client_max_body_size 410m 与 900s 超时(deploy/nginx/default.conf:14-20,52-60)；前端上传前跳过 >400MB 视频与 >30MB 图片并给出原因(web/src/lib/livePhoto.ts:211-231,255-271)。独立重跑 TestVideoSignLimits（400MB 可签名、400MB+1 拒绝、图片 30MB+1 拒绝）与 TestConfirmObjectSizeByMediaKind（31MB 视频入库、31MB 图片与 400MB+1 视频拒绝）均 PASS。","truncated":false},"result":"passed","source":"brief.md","text":"视频对象上限为 400MB、图片上限保持 30MB：不超过 400MB 的 mp4/mov 可完成签名与确认入库；超过 400MB 的视频在签名接口返回 400，前端在上传前跳过并提示；超过 30MB 的图片仍被签名接口拒绝。"},{"id":"A5","reason":{"text":"确认阶段 video_key 校验改为 MaxVideoUploadBytes(server/internal/handlers/photo.go:195-207)，并保留前缀、存在性、类型白名单校验；成对/合并识别逻辑未被改写，仅新增大小上限拦截(web/src/lib/livePhoto.ts:233-273)，视频失败降级仍为 confirm 不带 video_key 的普通照片(web/src/views/admin/AdminPhotosView.vue:137-148)。独立重跑 TestLivePhotoVideoSizeLimit（31MB video_key 入库、400MB+1 拒绝）、TestLivePhotoUploadFlow、TestQuickTimeVideoConfirmed、TestVideoKeyValidation、TestPlainPhotoKeepsSingleObject 均 PASS。","truncated":false},"result":"passed","source":"brief.md","text":"实况照片关联的视频同样按 400MB 校验，不超过 400MB 的 `video_key` 可以确认入库；成对/合并识别与视频失败降级为普通照片的行为保持不变。"},{"id":"A6","reason":{"text":"删除接口在返回前对 cos_key/thumbnail_key/video_key 去重后同步调用存储删除，失败对象逐个 EnqueueDeleteTask(server/internal/handlers/photo.go:468-489)；视频条目 cos_key 即视频对象、video_key 为空(store/queries_photo.go:12-27,161-179)。独立重跑 TestStandaloneVideoUploadFlow：DELETE 返回 200 后视频对象已不存在且 cos_delete_tasks 无待处理项；TestDeletePhotoEnqueuesWhenStorageDeleteFails 验证同