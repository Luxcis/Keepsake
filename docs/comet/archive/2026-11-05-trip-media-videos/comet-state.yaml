acceptance:
  - id: A1
    source: brief.md
    text: 前台不再出现「旅行足迹」：桌面主导航项、`/trips` 的路由标题与页面主标题、旅行详情返回链接均显示「足迹」，页面主标题为「我们的足迹」。
    result: passed
    reason:
      text: 桌面与移动端导航均为「足迹」(web/src/components/AppHeader.vue:23,38)；/trips
        路由标题「足迹」(web/src/router/index.ts:7)；页面主标题「我们的足迹」(web/src/views/TripsView.vue:59)；详情返回链接「←
        返回足迹」(web/src/views/TripDetailView.vue:105)。grep -rn 旅行足迹 web/src 无结果（仅
        docs/demo.html 与历史/规格文档残留，非前台应用产物）。
      truncated: false
  - id: A2
    source: brief.md
    text: 管理端只选择一个 mp4/mov
      视频（没有同名照片）时，视频完成签名与直传并创建一条视频媒体记录，上传任务区显示该视频的进度与完成状态，不再出现「视频不会单独上传」的跳过提示。
    result: passed
    reason:
      text: 未配对视频现在生成 kind='video'
        上传计划(web/src/lib/livePhoto.ts:275-282)，任务区展示「视频」徽标与进度/完成(web/src/views/admin/AdminPhotosView.vue:257-279)；上传以视频对象本身作为
        cos_key 签名直传并确认(AdminPhotosView.vue:122-127,151-159,161-168)，服务端确认按 HEAD
        视频类型写入
        media_kind=video(server/internal/handlers/photo.go:160-168,221-225)。旧「视频不会单独上传/未找到同名照片」文案
        grep 无结果。独立执行 go test -run TestStandaloneVideoUploadFlow
        通过，实测签名→PUT→confirm→列表 media_kind=video→video_src 可读取。
      truncated: false
  - id: A3
    source: brief.md
    text: 公开旅行详情中，视频条目与照片按接口返回顺序混排在同一网格；视频卡片显示播放标记，点击后在灯箱内播放，Esc
      可关闭，左右方向键可切换到相邻照片或视频。
    result: passed
    reason:
      text: 网格直接按 photos 数组（接口 sort_order, created_at 顺序）v-for
        混排(web/src/views/TripDetailView.vue:167-212)；视频卡片用 video 元素并以 ▶
        显示播放标记(:174-181,:201-206)；viewable 将 video_src 映射为 mediaKind='video'
        进入灯箱(:77-89)；灯箱渲染原生
        video(controls/autoplay/muted)(web/src/components/PhotoLightbox.vue:167-178)，Esc
        关闭与 ArrowLeft/ArrowRight 在 props.photos（照片与视频混合数组）上循环切换(:101-120)，视频因
        :key 切换/关闭而卸载停止播放。npx vue-tsc --noEmit -p tsconfig.app.json 独立执行退出码 0。
      truncated: false
  - id: A4
    source: brief.md
    text: 视频对象上限为 400MB、图片上限保持 30MB：不超过 400MB 的 mp4/mov 可完成签名与确认入库；超过 400MB
      的视频在签名接口返回 400，前端在上传前跳过并提示；超过 30MB 的图片仍被签名接口拒绝。
    result: passed
    reason:
      text: 上限常量为视频 400<<20、图片 30<<20(server/internal/config/config.go:15-18)；签名接口按
        content_type 选择上限并在 max_bytes 返回对应值(photo.go:46-53,91-96,105-111)；确认阶段按
        HEAD 内容类型分别校验 400MB/30MB(photo.go:160-178)，实况 video_key 亦用
        400MB(photo.go:200-203)；本地存储单对象放行到
        400MB(server/cmd/server/main.go:164-170)、nginx client_max_body_size 410m
        与 900s 超时(deploy/nginx/default.conf:14-20,52-60)；前端上传前跳过 >400MB 视频与
        >30MB 图片并给出原因(web/src/lib/livePhoto.ts:211-231,255-271)。独立重跑
        TestVideoSignLimits（400MB 可签名、400MB+1 拒绝、图片 30MB+1 拒绝）与
        TestConfirmObjectSizeByMediaKind（31MB 视频入库、31MB 图片与 400MB+1 视频拒绝）均 PASS。
      truncated: false
  - id: A5
    source: brief.md
    text: 实况照片关联的视频同样按 400MB 校验，不超过 400MB 的 `video_key`
      可以确认入库；成对/合并识别与视频失败降级为普通照片的行为保持不变。
    result: passed
    reason:
      text: 确认阶段 video_key 校验改为
        MaxVideoUploadBytes(server/internal/handlers/photo.go:195-207)，并保留前缀、存在性、类型白名单校验；成对/合并识别逻辑未被改写，仅新增大小上限拦截(web/src/lib/livePhoto.ts:233-273)，视频失败降级仍为
        confirm 不带 video_key
        的普通照片(web/src/views/admin/AdminPhotosView.vue:137-148)。独立重跑
        TestLivePhotoVideoSizeLimit（31MB video_key 入库、400MB+1
        拒绝）、TestLivePhotoUploadFlow、TestQuickTimeVideoConfirmed、TestVideoKeyValidation、TestPlainPhotoKeepsSingleObject
        均 PASS。
      truncated: false
  - id: A6
    source: brief.md
    text: 删除视频媒体条目时，接口返回前同步删除该视频对象，删除失败的对象进入补偿任务队列。
    result: passed
    reason:
      text: 删除接口在返回前对 cos_key/thumbnail_key/video_key 去重后同步调用存储删除，失败对象逐个
        EnqueueDeleteTask(server/internal/handlers/photo.go:468-489)；视频条目
        cos_key 即视频对象、video_key 为空(store/queries_photo.go:12-27,161-179)。独立重跑
        TestStandaloneVideoUploadFlow：DELETE 返回 200 后视频对象已不存在且 cos_delete_tasks
        无待处理项；TestDeletePhotoEnqueuesWhenStorageDeleteFails
        验证同步删除失败时以相同处理分支写入补偿任务（该用例使用图片 key，视频主对象复用同一循环）。
      truncated: false
