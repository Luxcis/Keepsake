核对；实际播放仍受浏览器对 HEIC/HEVC 的解码能力限制（brief 已声明不做转码）。","server/internal/handlers/photo.go servePhotos 对无视频照片也始终输出 video_src:\"\"（启用/未启用存储均如此），相对改动前是响应结构新增空字段；前端按空串视为普通照片，A3 行为不受影响，但与 spec 中“无视频照片的响应结构与改动前一致”的措辞存在轻微偏差。","PhotoWallView 的 LivePhotoMedia 位于 <button> 内，播放器自带的 LIVE 徽标点击会冒泡到卡片并触发灯箱打开，卡片上的播放器下拉菜单实际不可用；不影响 LIVE 标识、悬停/长按播放与灯箱自动播放验收。","合并文件识别依赖 live-photo 的“最后一个 ftyp + 前 8KB 内 moov/mdat”启发式；容器布局特殊（如 moov/mdat 均不在前 8KB）的合并文件会回退为普通图片，符合 spec 的校验约定但存在真实文件覆盖盲区。","video_key 的视频类型校验信任 HEAD 返回的 Content-Type（本地存储按扩展名推断），不做内容嗅探；错误标注 Content-Type 的对象可能通过视频白名单。"],"summary":"独立只读验收通过 A1-A9：同名配对、合并拆分、普通图片/未合并 HEIC 回退、视频失败降级、video_key 校验、删除补偿、前台播放组件接线与构建测试均核对通过。go build/go test/npm run build 本次独立运行成功。遗留风险主要是未在真实浏览器重放播放行为、无视频响应新增空 video_src 字段、卡片徽标点击冒泡与合并文件启发式覆盖面。","verdict":"pass"}},"verifierExecutionRef":"verifier-sess-live-photo-7c1e"}},{"sequence":11,"value":{"candidateId":"173b4b2f097d9651e5e91d0e6e0da06215a52fc828d1ed1b6325d8b3348689c9","reportRef":"docs/comet/changes/live-photo/verification.md","reportSha256":"ba9f93f315cc372d36fd3c47706287f7e0241cf2ac04a733422410ed4cb1f6d2","stateVersion":8}},{"sequence":12,"value":{"archiveDirRef":"docs/comet/archive/2026-11-05-live-photo","blockers":[],"candidateBinding":"v2:53384489d1b305d8cdca946a2f1a8fae190b30989422e31b9ed536d0a3f3ff3e","candidateId":"173b4b2f097d9651e5e91d0e6e0da06215a52fc828d1ed1b6325d8b3348689c9","capabilityPeers":[],"ready":true,"reportRef":"docs/comet/changes/live-photo/verification.md","reportSha256":"ba9f93f315cc372d36fd3c47706287f7e0241cf2ac04a733422410ed4cb1f6d2","reportStateVersion":8,"requiresReverification":false,"specPreview":[{"capability":"live-photo","current_hash":null,"operation":"create","source":"specs/live-photo/spec.md","target_hash":"667c34bf8b0a8ae23955e279b9cdf6929505aef51615b8af15ff748489eb440b"}],"stateVersion":9}},{"sequence":13,"value":{"archiveRef":"2026-11-05-live-photo","specCount":1,"stateVersion":9,"transactionId":"79fa2050-690c-4331-a11d-8cd93778045b"}},{"sequence":2,"value":{"choice":"rejected","proposal":{"input":{"artifactRootRef":"docs","name":"live-photo"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：在管理端同一批选择同名的图像文件与视频文件（如 `IMG_0001.HEIC` + `IMG_0001.MOV`）上传后，该旅行照片列表只新增 1 条照片记录，记录带实况视频，前台卡片与灯箱均可播放。"},{"id":"A2","source":"brief.md","text":"A2：在管理端选择一个内嵌视频的合并实况文件（JPEG+MP4 或 HEIC+MOV 合并）上传后，系统自动拆出静态图与视频两个对象，且只新增 1 条照片记录。"},{"id":"A3","source":"brief.md","text":"A3：选择普通 JPEG/PNG/WebP 图片（无同名视频、无可拆分视频）上传时，行为与改动前一致：1 个对象、1 条记录、无实况标识。"},{"id":"A4","source":"brief.md","text":"A4：上传单个未合并的 HEIC 图片时不会被误判为实况，仍按普通图片保存。"},{"id":"A5","source":"brief.md","text":"A5：实况视频对象上传失败但图片上传成功时，照片仍按普通照片入库，上传任务区显示实况视频失败原因，不丢失图片。"},{"id":"A6","source":"brief.md","text":"A6：确认请求里的 `video_key` 不属于该旅行前缀、对象不存在、内容类型不在视频白名单时，接口返回 400 且不创建照片记录。"},{"id":"A7","source":"brief.md","text":"A7：删除一张实况照片后，图片对象与视频对象都各有一条删除补偿任务（`cos_delete_tasks`）。"},{"id":"A8","source":"brief.md","text":"A8：前台照片墙中带视频的照片显示 LIVE 标识并在桌面悬停/触屏长按时播放，灯箱打开后自动播放；无视频照片仍显示静态图且无实况交互。"},{"id":"A9","source":"brief.md","text":"A9：`cd server && go build ./... && go test ./...` 与 `cd web && npm run build` 均通过。"},{"id":"A10","source":"brief.md","text":"存储链路保持现状：`POST /api/admin/uploads/sign` → 浏览器 PUT 直传 → `POST /api/admin/photos/confirm` HEAD 校验后入库；单对象 ≤ 30MB。"},{"id":"A11","source":"brief.md","text":"`video_key` 必须与 `cos_key` 同属 `trips/{tripID}/` 前缀，且只能以视频白名单（`video/mp4`、`video/quicktime`）出现。"},{"id":"A12","source":"brief.md","text":"合并文件只有在拆分结果同时通过图片魔数（JPEG SOI 或 HEIC/HEIF `ftyp`）与视频结构（`ftyp` + `moov`/`mdat`）校验时才按实况处理，否则按普通图片上传。"},{"id":"A13","source":"brief.md","text":"解析只发生在浏览器；服务端不下载、不读取对象内容做识别。"},{"id":"A14","source":"brief.md","text":"删除照片必须同时把 `video_key` 入队清理；无视频时行为不变。"},{"id":"A15","source":"brief.md","text":"无视频照片的请求、响应与页面渲染保持现有行为，不改动既有字段语义。"},{"id":"A16","source":"brief.md","text":"同一批次中未配对的视频不单独上传，只在上传任务区提示“未找到配对照片”。"},{"id":"A17","source":"brief.md","text":"HEIC 静帧与 HEVC 视频的浏览器兼容性沿用系统能力；Chrome 可能无法显示 HEIC 或解码 HEVC，本 change 不提供转码兜底。"},{"id":"A18","source":"brief.md","text":"依赖固定为 `live-photo@^0.2.0`（npm 当前 latest，含 viewer 与 extract 导出）。"},{"id":"A19","source":"brief.md","text":"实况状态由 `video_src` 是否存在派生，不新增数据库布尔字段。"},{"id":"A20","source":"brief.md","text":"上传顺序固定为「先图片、后视频」；视频失败不阻断照片入库，只降级为普通照片。"},{"id":"A21","source":"brief.md","text":"播放策略：照片墙卡片 `lazyLoadVideo: true`、悬停/长按播放；灯箱 `autoplay: true` + 静音（库默认）避免自动播放被浏览器拦截。"},{"id":"A22","source":"brief.md","text":"灯箱中通过 `imageCustomization`/`videoCustomization` 覆盖 `object-fit: contain`，卡片保持库默认 `cover`。"},{"id":"A23","source":"brief.md","text":"Go：`go build ./... && go test ./...`，新增测试使用本地存储后端走完整签名→PUT→confirm→列表→删除链路。"},{"id":"A24","source":"brief.md","text":"前端：`npm run build`（`vue-tsc -b` 类型检查 + Vite 构建）。"},{"id":"A25","source":"brief.md","text":"手工/浏览器：用 ffmpeg 合成 JPEG+MP4 合并文件与 HEIC+MOV 成对文件，验证上传后列表、卡片、灯箱、删除补偿。"}],"children":null,"formalHash":"a0f8c131f19175d267b8e9b6fd58856fe0c8213fb1fd975c193974db2e25c2b6","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"31de40fa044775f6cd044f04b39096a2f790bdb6daf1a7c97b211f0003582d26","contractHash":"1ff24beeea4c43b6888be417df49ddfe2db80dc11309ead60e26d34dff3a3749","inputHash":"7e8a7de78295696d5f7a7b68310c0535c9270c16f4e1ed5d5444ed6d24f543cc","legacyFingerprint":"e353b36895341afa3d75f51807f9c5619621814c91fc829102b9ebf2d2914246","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"667c34bf8b0a8ae23955e279b9cdf6929505aef51615b8af15ff748489eb440b","contractHash":"930d92489dff7d9dc61e8f35339daac040214abbce4ffec72cb26a21392fba70","inputHash":"8297e8c56d6abf3efcde7a42e73b64a8d2da9dca2062b8c7d8c9cba3c011f306","legacyFingerprint":"819cf527a77e7a39b5bf4d2f4b3bca1775b5620c851462255a7427fe442e3c1e","source":"specs/live-photo/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"42a6fef7361670d35b93c3583d0fbb4216164ca81f30a1e25c6198e8582bd33f","specChang